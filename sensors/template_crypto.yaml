# This is the template that works out the value of the wallet amount based on the input amount.
#- platform: template
#  sensors:
#    my_btc_value:
#     value_template: "{{ (states('sensor.exchange_rate_1_btc') | float * states('input_number.btc_amount') | float) | round(2) }}"

template:
  - sensor:
      - default_entity_id: sensor.my_btc_value
        state:
          "{{ (states('sensor.exchange_rate_1_btc') | float * states('input_number.btc_amount')
          | float) | round(2) }}"
        name: my_btc_value
