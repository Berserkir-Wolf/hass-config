#template:
- sensor:
    - default_entity_id: sensor.biltong_approximate_cost
      name: Biltong Approximate Cost
      state:
        ${{ (((states('sensor.biltong_rack_total_consumption'))|float) * ((states('input_number.power_rate'))|float))|round(3)
        }}
- sensor:
    - default_entity_id: sensor.biltong_approximate_cost_today
      name: Biltong Cost Today
      state:
        ${{ (((states('sensor.biltong_rack_today_s_consumption'))|float) * ((states('input_number.power_rate'))|float))|round(3)
        }}
- sensor:
    - default_entity_id: sensor.subwoofer_approximate_cost
      name: Subwoofer Approximate Cost
      state:
        ${{ (((states('sensor.subwoofer_total_consumption'))|float) * ((states('input_number.power_rate'))|float))|round(3)
        }}
- sensor:
    - default_entity_id: sensor.subwoofer_approximate_cost_today
      name: Subwoofer Cost Today
      state:
        ${{ (((states('sensor.subwoofer_today_s_consumption'))|float) * ((states('input_number.power_rate'))|float))|round(3)
        }}
