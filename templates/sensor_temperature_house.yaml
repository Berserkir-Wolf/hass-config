#template:
- sensor:
  - unique_id: bedroom_temperature
    unit_of_measurement: °C
    default_entity_id: sensor.bedroom_temperature
    name: Bedroom Temperature
    state: "{{ (state_attr('climate.bedroom_heater', 'current_temperature')) }}"
- sensor:
  - unique_id: bedroom_humidity
    unit_of_measurement: "%"
    default_entity_id: sensor.bedroom_humidity
    name: Bedroom Humidity
    state: "{{ (state_attr('climate.bedroom_heater', 'current_humidity')) }}"
- sensor:
  - unique_id: server_rack_temperature
    unit_of_measurement: °C
    default_entity_id: sensor.server_rack_temperature
    name: Server Rack Temperature
    state: "{{ (state_attr('climate.server_rack_fans', 'current_temperature')) }}"
- sensor:
  - unique_id: server_rack_humidity
    unit_of_measurement: "%"
    default_entity_id: sensor.server_rack_humidity
    name: Server Rack Humidity
    state: "{{ (state_attr('climate.server_rack_fans', 'current_humidity')) }}"
