# https://www.home-assistant.io/integrations/switch.template/

- platform: template
  switches:
    lounge_tv:
      value_template: "{{ is_state('media_player.2020_2021_uhd_android_tv', 'playing') }}"
      turn_on:
        action: media_player.turn_on
        target:
          entity_id: media_player.2020_2021_uhd_android_tv
      turn_off:
        action: media_player.turn_off
        target:
          entity_id: media_player.lounge_tv
