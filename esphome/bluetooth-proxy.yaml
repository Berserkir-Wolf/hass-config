esphome:
  name: bluetooth-proxy
  friendly_name: Bluetooth Proxy

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "ffo6XCoyUh2B3TkP8A0XJ/jmdUbkLywFIy4At3js6UI="

ota:
  - platform: esphome
    id: ota_esphome
    password: "6e6a7bea85595bd25a2be06c32fb25b4"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Bluetooth-Proxy Fallback Hotspot"
    password: "ZYdhthHrpbZH"

esp32_ble_tracker:
  scan_parameters:
    # We currently use the defaults to ensure Bluetooth
    # can co-exist with WiFi In the future we may be able to
    # enable the built-in coexistence logic in ESP-IDF
    active: true

bluetooth_proxy:
  active: true

web_server:
  port: 80
  auth: 
    username: admin
    password: "1234"

button:
  - platform: safe_mode
    id: button_safe_mode
    name: Safe Mode Boot

  - platform: factory_reset
    id: factory_reset_btn
    name: Factory reset
    